<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Next Movie</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><header class="navbar"><a class="brand" href="/"><span class="brand-icon">▣</span><span>Next Movie</span></a><a class="about-link" href="/">← Back to movies</a></header>
<main class="auth-shell"><section class="auth-card"><div class="eyebrow">WELCOME TO NEXT MOVIE</div><h1 id="authHeading">Your movie journey<br><span>starts here.</span></h1><p class="auth-intro">Create an account to save a watchlist, purchase licensed downloads, and keep your movies in one library.</p>
<div class="auth-tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Register</button><button id="adminTab">Admin</button></div>
<form id="authForm"><label id="nameWrap" hidden>Full name<input id="nameInput" autocomplete="name" maxlength="80" placeholder="Your name"></label><label>Email address<input id="emailInput" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="passwordInput" type="password" required autocomplete="current-password" minlength="8" placeholder="At least 8 characters"></label><button class="primary-btn auth-submit" type="submit" id="submitAuth">Login</button><p id="authMessage" class="form-message" role="status"></p></form>
<p class="auth-note">Admin access is restricted. Only the configured admin account can open the movie upload dashboard.</p></section></main><script src="auth.js"></script></body></html>
