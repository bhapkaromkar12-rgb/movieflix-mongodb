<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Next Movie</title><link rel="stylesheet" href="style.css"></head><body>
<header class="navbar"><a class="brand" href="/"><span class="brand-icon">▣</span><span>Next Movie</span></a><div class="nav-right"><span class="admin-label">ADMIN DASHBOARD</span><button id="logoutBtn" class="secondary-btn">Logout</button></div></header>
<main class="admin-shell"><div class="eyebrow">CONTENT MANAGEMENT</div><h1>Movie <span>Studio.</span></h1><p class="admin-intro">Add a movie here. Saved movies will appear in the public movie catalogue.</p>
<div class="admin-layout"><section class="admin-form-card"><h2>Upload a movie</h2><form id="movieForm" class="movie-form"><label>Movie title *<input name="title" required maxlength="150" placeholder="e.g. The Pursuit of Happyness"></label><div class="form-two"><label>Release year<input name="year" type="number" min="1888" max="2100" value="2024"></label><label>Rating (0–5)<input name="rating" type="number" min="0" max="5" step="0.1" value="4.0"></label></div><div class="form-two"><label>Genre<select name="genre"><option>Drama</option><option>Action</option><option>Comedy</option><option>Thriller</option><option>Sci-Fi</option><option>Animation</option><option>Romance</option><option>Horror</option><option>Adventure</option></select></label><label>Language<select name="language"><option>Hindi</option><option>English</option><option>Marathi</option><option>Tamil</option><option>Telugu</option><option>Korean</option><option>Japanese</option><option>Other</option></select></label></div><label>Poster image URL<input name="poster" type="url" placeholder="https://.../poster.jpg"></label><label>Director<input name="director" maxlength="120" placeholder="Director name"></label><label>Cast<input name="cast" maxlength="300" placeholder="Actor 1, Actor 2, Actor 3"></label><label>Movie description<textarea name="description" rows="4" maxlength="3000" placeholder="Write a short synopsis..."></textarea></label><label>Upload trailer video (MP4, WebM, MOV — max 100 MB)<input name="trailerFile" type="file" accept="video/mp4,video/webm,video/ogg,video/quicktime,video/x-msvideo"><small class="muted-text">Uploaded trailer will be saved and shown to users on the movie details page.</small></label><label>Or trailer URL (optional)<input name="trailerUrl" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><button class="primary-btn" type="submit">＋ Publish movie</button><p class="form-message" id="adminMessage" role="status"></p></form></section>
<section class="admin-list-card"><div class="admin-list-heading"><h2>Recently added</h2><button class="secondary-btn" id="refreshMovies">Refresh</button></div><div id="adminMovieList" class="admin-movie-list">Loading movies...</div></section></div></main><script src="admin.js"></script></body></html>
